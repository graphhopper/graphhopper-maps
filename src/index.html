<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
        <meta
            name="description"
            content="Plan routes and get driving directions from GraphHopper Maps using open source and open data"
        />
        <meta
            name="keywords"
            content="openstreetmap,osm,bicycle,hiking,outdoor,truck,shortest path,driving directions"
        />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="GraphHopper Maps" />
        <meta property="og:title" content="GraphHopper Maps | Route Planner" />
        <meta
            property="og:description"
            content="Plan routes and get driving directions from GraphHopper Maps using open source and open data"
        />
        <meta property="og:url" content="https://graphhopper.com/maps/" />
        <!-- an image narrower than 300px makes WhatsApp & co render the compact card (small thumbnail) instead of a full-width image -->
        <meta property="og:image" content="https://graphhopper.com/maps/assets/android-chrome-192x192.png" />
        <meta property="og:image:width" content="192" />
        <meta property="og:image:height" content="192" />
        <meta name="twitter:card" content="summary" />
        <link rel="manifest" href="./manifest.json" />
        <!-- config.js is not included in bundle.js -->
        <script src="config.js"></script>
        <title>GraphHopper Maps | Route Planner</title>
        <style>
            html,
            body {
                overscroll-behavior: none;
                height: 100%;
                width: 100%;
                margin: 0;
                padding: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                min-height: 100%;
            }

            @media (min-resolution: 2dppx) and (min-height: 700px) {
                html {
                    font-size: 118%;
                }
            }

            ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
            }

            svg {
                display: block;
                color: inherit;
            }
        </style>
    </head>
    <body></body>
</html>
